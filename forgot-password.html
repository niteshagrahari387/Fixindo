<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Reset password — FIXINDO</title>

    <link rel="icon" href="assets/logo/fixindo-mark.svg">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/pages.css">

</head>


<body>

    <!-- Header -->
    <div
        data-site-header
        data-root="."
    ></div>


    <main id="main">


        <!-- ==================== PAGE HERO ==================== -->

        <section class="page-hero">

            <div class="container">

                <span class="eyebrow">
                    Account recovery
                </span>

                <h1>
                    Reset your password.
                </h1>

                <p>
                    We’ll send reset instructions to your
                    registered email address.
                </p>

            </div>

        </section>


        <!-- ==================== RESET PASSWORD FORM ==================== -->

        <section class="section">

            <div class="container">

                <form
                    class="form-card"
                    data-validate
                    data-api-form="forgot-password"
                >

                    <h1>
                        Forgot password?
                    </h1>


                    <!-- Form Fields -->

                    <div class="form-grid">

                        <label class="field full">

                            Email address

                            <input
                                required
                                type="email"
                                name="email"
                                placeholder="you@example.com"
                            >

                            <span class="error"></span>

                        </label>

                    </div>


                    <!-- Form Actions -->

                    <div class="form-actions">

                        <a
                            class="text-link"
                            href="login.html"
                        >
                            Back to sign in
                        </a>

                        <button
                            class="primary-btn"
                            type="submit"
                        >
                            Send reset link
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <div
        data-site-footer
        data-root="."
    ></div>


    <!-- JavaScript -->

    <script
        defer
        src="js/utils.js"
    ></script>

    <script
        defer
        src="js/validation.js"
    ></script>

    <script
        defer
        src="js/app.js"
    ></script>

</body>

</html>
