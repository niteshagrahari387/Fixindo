```html id="45281"
<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Sign in — FIXINDO</title>

    <link
        rel="icon"
        href="assets/logo/fixindo-mark.svg"
    >

    <!-- Stylesheets -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/navbar.css"
    >

    <link
        rel="stylesheet"
        href="css/footer.css"
    >

    <link
        rel="stylesheet"
        href="css/forms.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="css/pages.css"
    >

</head>


<body>

    <!-- Header -->
    <div
        data-site-header
        data-root="."
    ></div>


    <main id="main">


        <!-- ==================== PAGE HERO ==================== -->

        <section class="page-hero">

            <div class="container">

                <span class="eyebrow">
                    Welcome back
                </span>

                <h1>
                    Sign in to continue with FIXINDO.
                </h1>

                <p>
                    Use your secure account to manage bookings,
                    requests, and your profile.
                </p>

            </div>

        </section>


        <!-- ==================== SIGN IN SECTION ==================== -->

        <section class="section">

            <div class="container">


                <!-- ==================== SIGN IN FORM ==================== -->

                <form
                    class="form-card"
                    data-validate
                    data-api-form="login"
                >

                    <h1>
                        Sign in
                    </h1>

                    <p>
                        Use your email and password to continue.
                    </p>


                    <!-- Google Sign In -->

                    <button
                        type="button"
                        class="google-button"
                        data-demo-action="Google sign-in will be enabled when Firebase credentials are configured."
                    >

                        <span
                            style="
                                color: #4285f4;
                                font-size: 16px;
                            "
                        >
                            G
                        </span>

                        Continue with Google

                    </button>


                    <!-- Divider -->

                    <div class="divider">
                        or use email
                    </div>


                    <!-- ==================== FORM FIELDS ==================== -->

                    <div class="form-grid">


                        <!-- Email -->

                        <label class="field full">

                            Email address

                            <input
                                required
                                type="email"
                                name="email"
                                placeholder="you@example.com"
                            >

                            <span class="error"></span>

                        </label>


                        <!-- Password -->

                        <label class="field full">

                            Password

                            <input
                                required
                                type="password"
                                name="password"
                                placeholder="At least 8 characters"
                            >

                            <span class="error"></span>

                        </label>

                    </div>


                    <!-- ==================== FORM ACTIONS ==================== -->

                    <div class="form-actions">

                        <span>

                            <a
                                class="text-link"
                                href="register.html"
                            >
                                Create an account
                            </a>

                            ·

                            <a
                                class="text-link"
                                href="forgot-password.html"
                            >
                                Forgot password?
                            </a>

                        </span>

                        <button
                            class="primary-btn"
                            type="submit"
                        >
                            Sign in
                        </button>

                    </div>

                </form>


                <!-- ==================== GUEST ACCESS ==================== -->

                <div
                    style="
                        text-align: center;
                        margin-top: 16px;
                    "
                >

                    <a
                        class="text-link"
                        href="customer/dashboard.html"
                    >
                        Continue as guest customer →
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <div
        data-site-footer
        data-root="."
    ></div>


    <!-- JavaScript -->

    <script
        defer
        src="js/utils.js"
    ></script>

    <script
        defer
        src="js/validation.js"
    ></script>

    <script
        defer
        src="js/app.js"
    ></script>

</body>

</html>
```
