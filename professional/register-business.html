```html
<!doctype html>
<html lang="en">

<head>

    <!-- ==================== META ==================== -->

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >


    <!-- ==================== PAGE TITLE ==================== -->

    <title>Register business — FIXINDO</title>


    <!-- ==================== FAVICON ==================== -->

    <link
        rel="icon"
        href="../assets/logo/fixindo-mark.svg"
    >


    <!-- ==================== STYLESHEETS ==================== -->

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/navbar.css"
    >

    <link
        rel="stylesheet"
        href="../css/footer.css"
    >

    <link
        rel="stylesheet"
        href="../css/forms.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="../css/pages.css"
    >

</head>


<body>

    <!-- ==================== HEADER ==================== -->

    <div
        data-site-header
        data-root=".."
    ></div>


    <main id="main">


        <!-- ==================================================
             PAGE HERO
        =================================================== -->

        <section class="page-hero">

            <div class="container">

                <span class="eyebrow">
                    Professional registration
                </span>

                <h1>
                    Set up your business profile.
                </h1>

                <p>
                    Share the essentials to create a profile
                    and submit it for verification.
                </p>

            </div>

        </section>


        <!-- ==================================================
             REGISTRATION SECTION
        =================================================== -->

        <section class="section">

            <div class="container">

                <form
                    class="form-card"
                    data-validate
                    data-api-form="provider-registration"
                >


                    <!-- ==================== FORM HEADER ==================== -->

                    <h1>
                        Register your business
                    </h1>

                    <p>
                        Your profile is saved securely and reviewed
                        before it becomes searchable.
                    </p>


                    <!-- ==================================================
                         FORM FIELDS
                    =================================================== -->

                    <div class="form-grid">


                        <!-- Owner Name -->

                        <label class="field">

                            Owner name

                            <input
                                required
                                name="owner"
                                placeholder="Your full name"
                            >

                            <span class="error"></span>

                        </label>


                        <!-- Mobile Number -->

                        <label class="field">

                            Mobile number

                            <input
                                required
                                name="mobile"
                                data-mobile
                                placeholder="10-digit mobile number"
                            >

                            <span class="error"></span>

                        </label>


                        <!-- Business Name -->

                        <label class="field">

                            Business name

                            <input
                                required
                                name="business"
                                placeholder="Your shop or business name"
                            >

                            <span class="error"></span>

                        </label>


                        <!-- Primary Category -->

                        <label class="field">

                            Primary category

                            <select
                                required
                                name="category"
                            >

                                <option value="">
                                    Select category
                                </option>

                                <option>
                                    Electrician
                                </option>

                                <option>
                                    Plumbing
                                </option>

                                <option>
                                    AC Repair
                                </option>

                                <option>
                                    Cleaning
                                </option>

                                <option>
                                    Carpentry
                                </option>

                            </select>

                            <span class="error"></span>

                        </label>


                        <!-- Aadhaar Number -->

                        <label class="field">

                            Aadhaar number

                            <input
                                required
                                name="aadhaar"
                                placeholder="XXXX XXXX XXXX"
                            >

                            <span class="error"></span>

                        </label>


                        <!-- Experience -->

                        <label class="field">

                            Experience

                            <select
                                required
                                name="experience"
                            >

                                <option value="">
                                    Select experience
                                </option>

                                <option>
                                    10+ years
                                </option>

                                <option>
                                    5–10 years
                                </option>

                                <option>
                                    2–5 years
                                </option>

                                <option>
                                    Less than 2 years
                                </option>

                            </select>

                            <span class="error"></span>

                        </label>


                        <!-- Business Address -->

                        <label class="field full">

                            Business address

                            <input
                                required
                                name="address"
                                placeholder="Shop / house number, street, city"
                            >

                            <span class="error"></span>

                        </label>


                        <!-- Business Location -->

                        <label class="field full">

                            Business location

                            <div data-map-placeholder></div>

                        </label>


                        <!-- Working Hours -->

                        <label class="field">

                            Working hours

                            <select
                                required
                                name="workingHours"
                            >

                                <option>
                                    9:00 AM – 7:00 PM
                                </option>

                                <option>
                                    8:00 AM – 8:00 PM
                                </option>

                                <option>
                                    24-hour emergency service
                                </option>

                            </select>

                            <span class="error"></span>

                        </label>


                        <!-- Emergency Service -->

                        <label class="field">

                            Emergency service

                            <select
                                required
                                name="emergencyService"
                            >

                                <option>
                                    Yes
                                </option>

                                <option>
                                    No
                                </option>

                            </select>

                            <span class="error"></span>

                        </label>

                    </div>


                    <!-- ==================================================
                         FORM ACTIONS
                    =================================================== -->

                    <div class="form-actions">

                        <a
                            class="text-link"
                            href="dashboard.html"
                        >
                            Open dashboard
                        </a>

                        <button
                            class="primary-btn"
                            type="submit"
                        >
                            Save and continue
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>


    <!-- ==================== FOOTER ==================== -->

    <div
        data-site-footer
        data-root=".."
    ></div>


    <!-- ==================== JAVASCRIPT ==================== -->

    <script
        defer
        src="../js/utils.js"
    ></script>

    <script
        defer
        src="../js/validation.js"
    ></script>

    <script
        defer
        src="../js/location.js"
    ></script>

    <script
        defer
        src="../js/maps.js"
    ></script>

    <script
        defer
        src="../js/app.js"
    ></script>

</body>

</html>
