<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Create account — FIXINDO</title>

    <link
        rel="icon"
        href="assets/logo/fixindo-mark.svg"
    >

    <!-- Stylesheets -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/navbar.css"
    >

    <link
        rel="stylesheet"
        href="css/footer.css"
    >

    <link
        rel="stylesheet"
        href="css/forms.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="css/pages.css"
    >

</head>


<body>

    <!-- Header -->
    <div
        data-site-header
        data-root="."
    ></div>


    <main id="main">


        <!-- ==================== PAGE HERO ==================== -->

        <section class="page-hero">

            <div class="container">

                <span class="eyebrow">
                    Customer registration
                </span>

                <h1>
                    Create your FIXINDO profile.
                </h1>

                <p>
                    Create a secure account for bookings,
                    saved addresses, and service history.
                </p>

            </div>

        </section>


        <!-- ==================== REGISTRATION SECTION ==================== -->

        <section class="section">

            <div class="container">

                <form
                    class="form-card"
                    data-validate
                    data-api-form="register"
                >

                    <h1>
                        Create account
                    </h1>

                    <p>
                        Get faster bookings, saved addresses,
                        and service history.
                    </p>


                    <!-- ==================== FORM FIELDS ==================== -->

                    <div class="form-grid">


                        <!-- Full Name -->

                        <label class="field">

                            Full name

                            <input
                                required
                                name="name"
                                placeholder="Your full name"
                            >

                            <span class="error"></span>

                        </label>


                        <!-- Mobile Number -->

                        <label class="field">

                            Mobile number

                            <input
                                required
                                name="mobile"
                                data-mobile
                                placeholder="10-digit mobile number"
                            >

                            <span class="error"></span>

                        </label>


                        <!-- Email -->

                        <label class="field full">

                            Email address

                            <input
                                required
                                type="email"
                                name="email"
                                placeholder="you@example.com"
                            >

                            <span class="error"></span>

                        </label>


                        <!-- Password -->

                        <label class="field">

                            Password

                            <input
                                required
                                type="password"
                                name="password"
                                placeholder="At least 8 characters"
                            >

                            <span class="error"></span>

                        </label>


                        <!-- Confirm Password -->

                        <label class="field">

                            Confirm password

                            <input
                                required
                                type="password"
                                data-match="[name=password]"
                                placeholder="Repeat password"
                            >

                            <span class="error"></span>

                        </label>


                        <!-- City -->

                        <label class="field full">

                            City

                            <input
                                required
                                name="city"
                                value="New Delhi"
                            >

                            <span class="error"></span>

                        </label>

                    </div>


                    <!-- ==================== TERMS & PRIVACY ==================== -->

                    <label class="check-row">

                        <input
                            type="checkbox"
                            required
                        >

                        I agree to the

                        <a
                            class="text-link"
                            href="terms.html"
                        >
                            terms
                        </a>

                        and

                        <a
                            class="text-link"
                            href="privacy.html"
                        >
                            privacy notice
                        </a>.

                    </label>


                    <!-- ==================== FORM ACTIONS ==================== -->

                    <div class="form-actions">

                        <a
                            class="text-link"
                            href="login.html"
                        >
                            Already have an account?
                        </a>

                        <button
                            class="primary-btn"
                            type="submit"
                        >
                            Create account
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <div
        data-site-footer
        data-root="."
    ></div>


    <!-- JavaScript -->

    <script
        defer
        src="js/utils.js"
    ></script>

    <script
        defer
        src="js/validation.js"
    ></script>

    <script
        defer
        src="js/profile.js"
    ></script>

    <script
        defer
        src="js/app.js"
    ></script>

</body>

</html>
