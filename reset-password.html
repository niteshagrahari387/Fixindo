<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Choose password — FIXINDO</title>

    <!-- Favicon -->
    <link
        rel="icon"
        href="assets/logo/fixindo-mark.svg"
    >

    <!-- Stylesheets -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/navbar.css"
    >

    <link
        rel="stylesheet"
        href="css/footer.css"
    >

    <link
        rel="stylesheet"
        href="css/forms.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="css/pages.css"
    >

</head>


<body>

    <!-- ==================== HEADER ==================== -->

    <div
        data-site-header
        data-root="."
    ></div>


    <main id="main">


        <!-- ==================== PAGE HERO ==================== -->

        <section class="page-hero">

            <div class="container">

                <span class="eyebrow">
                    Account recovery
                </span>

                <h1>
                    Choose a new password.
                </h1>

                <p>
                    Enter the secure reset token from your email
                    and a new password.
                </p>

            </div>

        </section>


        <!-- ==================== RESET PASSWORD FORM ==================== -->

        <section class="section">

            <div class="container">

                <form
                    class="form-card"
                    data-validate
                    data-api-form="reset-password"
                >

                    <h1>
                        Set a new password
                    </h1>


                    <!-- Form Fields -->

                    <div class="form-grid">


                        <!-- Reset Token -->

                        <label class="field full">

                            Reset token

                            <input
                                required
                                name="token"
                                placeholder="Paste reset token"
                            >

                            <span class="error"></span>

                        </label>


                        <!-- New Password -->

                        <label class="field full">

                            New password

                            <input
                                required
                                type="password"
                                name="password"
                                placeholder="At least 8 characters"
                            >

                            <span class="error"></span>

                        </label>

                    </div>


                    <!-- Form Actions -->

                    <div class="form-actions">

                        <a
                            class="text-link"
                            href="login.html"
                        >
                            Back to sign in
                        </a>

                        <button
                            class="primary-btn"
                            type="submit"
                        >
                            Update password
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>


    <!-- ==================== FOOTER ==================== -->

    <div
        data-site-footer
        data-root="."
    ></div>


    <!-- ==================== JAVASCRIPT ==================== -->

    <script
        defer
        src="js/utils.js"
    ></script>

    <script
        defer
        src="js/validation.js"
    ></script>

    <script
        defer
        src="js/app.js"
    ></script>

</body>

</html>
